<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ตัดสิ่งเกินให้สารชัดขึ้น</title><desc id="desc">เทียบกรอบข้อความแน่นกับข้อความสำคัญสองบรรทัด เรื่องเริ่มพกแก้ว</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#0B1020"/><text x="100" y="150" font-size="65" fill="#FFFFFF" font-weight="700">ตัดสิ่งเกิน ให้สารชัดขึ้น</text><text x="100" y="300" font-size="30" fill="#D2DAEB" font-weight="400">ก่อน</text><text x="865" y="300" font-size="30" fill="#B9A7FF" font-weight="400">หลัง</text><rect x="100" y="345" width="630" height="355" rx="20" fill="#202B43"/><rect x="865" y="345" width="630" height="355" rx="20" fill="#202B43"/><rect x="140" y="390" width="480" height="12" rx="6" fill="#A5B2CA"/><rect x="140" y="430" width="510" height="12" rx="6" fill="#A5B2CA"/><rect x="140" y="470" width="420" height="12" rx="6" fill="#A5B2CA"/><rect x="140" y="510" width="490" height="12" rx="6" fill="#A5B2CA"/><rect x="140" y="550" width="390" height="12" rx="6" fill="#A5B2CA"/><rect x="140" y="590" width="450" height="12" rx="6" fill="#A5B2CA"/><text x="905" y="455" font-size="57" fill="#FFFFFF" font-weight="700">เริ่มพกแก้ว</text><text x="905" y="550" font-size="57" fill="#FFFFFF" font-weight="700">วันจันทร์นี้</text><text x="100" y="810" font-size="30" fill="#D2DAEB" font-weight="400">ย้ายรายละเอียดไปบันทึกผู้พูด แล้วคงสารหลักบนจอ</text></g></svg>