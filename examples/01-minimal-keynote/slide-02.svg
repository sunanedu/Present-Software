<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">หนึ่งหน้าหนึ่งความคิด</title><desc id="desc">เลขหนึ่งขนาดใหญ่แสดงหลักหนึ่งประเด็นต่อหน้า ไม่ใช่ผลวิจัย</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#0B1020"/><text x="100" y="145" font-size="65" fill="#FFFFFF" font-weight="700">หนึ่งหน้า หนึ่งความคิด</text><text x="100" y="670" font-size="460" fill="#B9A7FF" font-weight="700">1</text><text x="620" y="395" font-size="66" fill="#FFFFFF" font-weight="700">เลือกสารหลัก</text><text x="620" y="495" font-size="66" fill="#FFFFFF" font-weight="700">ให้ผู้ฟังจำได้</text><text x="620" y="650" font-size="27" fill="#D2DAEB" font-weight="400">หนึ่ง คือหลักการออกแบบ ไม่ใช่สถิติ</text></g></svg>