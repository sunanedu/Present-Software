<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">คิดชัดก่อนเปิดสไลด์</title><desc id="desc">ปกแนวมินิมอลสีเข้ม มีชื่อแนวคิด FOCUS และวงกลมซ้อนเป็นภาพจุดสนใจ</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#0B1020"/><text x="110" y="145" font-size="30" fill="#B9A7FF" font-weight="700">FOCUS</text><text x="110" y="350" font-size="94" fill="#FFFFFF" font-weight="700">คิดชัด</text><text x="110" y="490" font-size="94" fill="#FFFFFF" font-weight="700">ก่อนเปิดสไลด์</text><text x="110" y="730" font-size="32" fill="#D2DAEB" font-weight="400">แนวคิดฝึกออกแบบงานนำเสนอ</text><circle cx="1240" cy="420" r="175" fill="#332B56"/><circle cx="1240" cy="420" r="110" fill="#7561B5"/><circle cx="1240" cy="420" r="43" fill="#B9A7FF"/></g></svg>