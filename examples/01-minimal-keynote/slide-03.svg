<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">จากเรื่องยาวสู่เรื่องที่จำได้</title><desc id="desc">สามขั้นตอนวางเรียงซ้ายไปขวา ตั้งโจทย์ จัดลำดับ เล่าให้เห็น</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#0B1020"/><text x="100" y="170" font-size="70" fill="#FFFFFF" font-weight="700">จากเรื่องยาว</text><text x="100" y="270" font-size="70" fill="#FFFFFF" font-weight="700">สู่เรื่องที่จำได้</text><rect x="100" y="390" width="420" height="3" rx="0" fill="#51418D"/><text x="100" y="490" font-size="50" fill="#B9A7FF" font-weight="700">01</text><text x="100" y="590" font-size="42" fill="#FFFFFF" font-weight="700">ตั้งโจทย์</text><text x="100" y="670" font-size="28" fill="#D2DAEB" font-weight="400">ผู้ฟังต้องรู้อะไร</text><rect x="605" y="390" width="420" height="3" rx="0" fill="#51418D"/><text x="605" y="490" font-size="50" fill="#B9A7FF" font-weight="700">02</text><text x="605" y="590" font-size="42" fill="#FFFFFF" font-weight="700">จัดลำดับ</text><text x="605" y="670" font-size="28" fill="#D2DAEB" font-weight="400">เล่าให้เชื่อมกัน</text><rect x="1110" y="390" width="420" height="3" rx="0" fill="#51418D"/><text x="1110" y="490" font-size="50" fill="#B9A7FF" font-weight="700">03</text><text x="1110" y="590" font-size="42" fill="#FFFFFF" font-weight="700">เล่าให้เห็น</text><text x="1110" y="670" font-size="28" fill="#D2DAEB" font-weight="400">เลือกภาพที่ช่วยอธิบาย</text></g></svg>