<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">เริ่มด้วยเรื่องเดียวที่อยากให้คนจำ</title><desc id="desc">หน้าจบมีคำเชิญให้เขียนสารหลักหนึ่งประโยค</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#0B1020"/><text x="100" y="290" font-size="88" fill="#FFFFFF" font-weight="700">เริ่มด้วยเรื่องเดียว</text><text x="100" y="425" font-size="88" fill="#FFFFFF" font-weight="700">ที่อยากให้คนจำ</text><rect x="100" y="565" width="1250" height="4" rx="0" fill="#B9A7FF"/><text x="100" y="690" font-size="40" fill="#B9A7FF" font-weight="700">เขียนสารหลัก 1 ประโยค ก่อนสร้างหน้าแรก</text></g></svg>