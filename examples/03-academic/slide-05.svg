<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ข้อสรุปและข้อจำกัดของข้อมูลสมมติ</title><desc id="desc">สรุปความต่างเชิงพรรณนา พร้อมข้อจำกัดและแนวทางศึกษาเพิ่มเติม ไม่อ้างนัยสำคัญหรือเหตุและผล</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF"/><text x="100" y="160" font-size="60" fill="#183153" font-weight="700">เห็นความต่างของเวลา</text><text x="100" y="260" font-size="60" fill="#183153" font-weight="700">ยังสรุปเหตุและผลไม่ได้</text><text x="100" y="440" font-size="29" fill="#006D77" font-weight="700">ข้อจำกัด</text><text x="100" y="520" font-size="35" fill="#183153" font-weight="400">ข้อมูลสมมติ กลุ่มเดียว และอาจมีผลจากการฝึกซ้ำ</text><text x="100" y="595" font-size="35" fill="#183153" font-weight="400">ไม่มีข้อมูลรายคนหรือการทดสอบนัยสำคัญ</text><rect x="100" y="690" width="1370" height="3" rx="0" fill="#C5DDE0"/><text x="100" y="775" font-size="36" fill="#006D77" font-weight="700">งานถัดไป: ออกแบบการทดลองและเก็บข้อมูลจริง</text></g></svg>