<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">คำถามและวัตถุประสงค์</title><desc id="desc">คำถามเกี่ยวกับความแตกต่างของเวลาเฉลี่ย ไม่กล่าวอ้างเหตุและผล</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF"/><text x="100" y="155" font-size="60" fill="#183153" font-weight="700">คำถามและวัตถุประสงค์</text><text x="100" y="310" font-size="29" fill="#006D77" font-weight="700">คำถาม</text><text x="100" y="395" font-size="44" fill="#183153" font-weight="400">เวลาเฉลี่ยในการร่างสไลด์ต่างกันเพียงใด</text><text x="100" y="480" font-size="44" fill="#183153" font-weight="400">เมื่อร่างเองและเมื่อใช้ AI ช่วยวางโครง</text><rect x="100" y="590" width="1370" height="3" rx="0" fill="#C5DDE0"/><text x="100" y="680" font-size="35" fill="#183153" font-weight="400">วัตถุประสงค์: เปรียบเทียบเวลาในสถานการณ์ฝึก</text><text x="100" y="820" font-size="27" fill="#006D77" font-weight="400">โจทย์และข้อมูลสมมติสำหรับฝึกออกแบบ</text></g></svg>