<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">เวลาเฉลี่ยต่างกันสิบนาทีในข้อมูลสมมติ</title><desc id="desc">กราฟแท่งเริ่มแกนที่ศูนย์ถึงหกสิบนาที ร่างเองเฉลี่ยสี่สิบห้า AI ช่วยสามสิบห้านาที ค่าสมมติ</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF"/><text x="100" y="145" font-size="58" fill="#183153" font-weight="700">เวลาเฉลี่ยต่างกัน 10 นาที</text><text x="100" y="220" font-size="28" fill="#006D77" font-weight="400">ข้อมูลสมมติ n = 30 · ค่าเฉลี่ยตั้งขึ้นเพื่อฝึกออกแบบกราฟ</text><rect x="370" y="290" width="1" height="370" rx="0" fill="#CBD5E1"/><text x="360" y="715" font-size="26" fill="#183153" font-weight="400">0</text><rect x="625" y="290" width="1" height="370" rx="0" fill="#CBD5E1"/><text x="615" y="715" font-size="26" fill="#183153" font-weight="400">15</text><rect x="880" y="290" width="1" height="370" rx="0" fill="#CBD5E1"/><text x="870" y="715" font-size="26" fill="#183153" font-weight="400">30</text><rect x="1135" y="290" width="1" height="370" rx="0" fill="#CBD5E1"/><text x="1125" y="715" font-size="26" fill="#183153" font-weight="400">45</text><rect x="1390" y="290" width="1" height="370" rx="0" fill="#CBD5E1"/><text x="1380" y="715" font-size="26" fill="#183153" font-weight="400">60</text><text x="100" y="405" font-size="29" fill="#183153" font-weight="400">ร่างเอง</text><rect x="370" y="350" width="765" height="85" rx="4" fill="#526273"/><text x="1160" y="405" font-size="34" fill="#526273" font-weight="700">45</text><text x="100" y="565" font-size="29" fill="#183153" font-weight="400">AI ช่วยวางโครง</text><rect x="370" y="510" width="595" height="85" rx="4" fill="#006D77"/><text x="990" y="565" font-size="34" fill="#006D77" font-weight="700">35</text><text x="1250" y="770" font-size="28" fill="#183153" font-weight="400">เวลา (นาที)</text><text x="100" y="845" font-size="26" fill="#006D77" font-weight="400">ที่มา: ชุดค่าสรุปสมมติของหลักสูตร ไม่ใช่ผลวิจัย</text></g></svg>