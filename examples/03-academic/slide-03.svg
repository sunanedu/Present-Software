<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">วิธีการในสถานการณ์จำลอง</title><desc id="desc">สมมติผู้เรียนสามสิบคนในกลุ่มเดียวสร้างงานห้าสไลด์สองเงื่อนไข ไม่ใช่การเก็บข้อมูลจริง</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF"/><text x="100" y="150" font-size="58" fill="#183153" font-weight="700">วิธีการในสถานการณ์จำลอง</text><text x="100" y="310" font-size="43" fill="#006D77" font-weight="700">01</text><text x="250" y="310" font-size="40" fill="#183153" font-weight="700">ผู้เรียน 30 คน</text><text x="250" y="375" font-size="30" fill="#183153" font-weight="400">กลุ่มเดียว ทำงานสองเงื่อนไข</text><text x="100" y="470" font-size="43" fill="#006D77" font-weight="700">02</text><text x="250" y="470" font-size="40" fill="#183153" font-weight="700">งาน 5 สไลด์</text><text x="250" y="535" font-size="30" fill="#183153" font-weight="400">กำหนดโจทย์และเวลาวัดให้ชัด</text><text x="100" y="630" font-size="43" fill="#006D77" font-weight="700">03</text><text x="250" y="630" font-size="40" fill="#183153" font-weight="700">เปรียบเทียบค่าเฉลี่ย</text><text x="250" y="695" font-size="30" fill="#183153" font-weight="400">ยังไม่มีการทดสอบนัยสำคัญ</text><text x="100" y="835" font-size="26" fill="#006D77" font-weight="400">สมมติวิธีการเพื่อฝึกเล่าเรื่อง ไม่มีการเก็บข้อมูลรายบุคคลจริง</text></g></svg>