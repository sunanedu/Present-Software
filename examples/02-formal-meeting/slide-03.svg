<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">วาระประชุมสามสิบนาที</title><desc id="desc">วาระสามส่วนใช้เวลา 5, 15 และ 10 นาที รวม 30 นาที ข้อมูลสมมติ</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F8FAFC"/><text x="100" y="145" font-size="58" fill="#10243A" font-weight="700">วาระประชุม 30 นาที</text><text x="100" y="315" font-size="38" fill="#8A5A14" font-weight="700">01</text><text x="230" y="315" font-size="40" fill="#10243A" font-weight="700">แจ้งเพื่อทราบ</text><text x="1300" y="315" font-size="32" fill="#10243A" font-weight="400">5 นาที</text><rect x="230" y="360" width="250" height="9" rx="4" fill="#8A5A14"/><text x="100" y="475" font-size="38" fill="#8A5A14" font-weight="700">02</text><text x="230" y="475" font-size="40" fill="#10243A" font-weight="700">พิจารณากิจกรรม</text><text x="1300" y="475" font-size="32" fill="#10243A" font-weight="400">15 นาที</text><rect x="230" y="520" width="750" height="9" rx="4" fill="#8A5A14"/><text x="100" y="635" font-size="38" fill="#8A5A14" font-weight="700">03</text><text x="230" y="635" font-size="40" fill="#10243A" font-weight="700">สรุปมติและงานถัดไป</text><text x="1300" y="635" font-size="32" fill="#10243A" font-weight="400">10 นาที</text><rect x="230" y="680" width="500" height="9" rx="4" fill="#8A5A14"/><text x="100" y="835" font-size="26" fill="#526273" font-weight="400">เวลาเป็นข้อเสนอสมมติ: 5 + 15 + 10 = 30 นาที</text></g></svg>