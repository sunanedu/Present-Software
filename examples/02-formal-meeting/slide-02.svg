<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">วันนี้ต้องได้ข้อสรุปสามเรื่อง</title><desc id="desc">สามผลลัพธ์การประชุม ได้แก่ กำหนดการ ผู้รับผิดชอบ และทรัพยากร</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F8FAFC"/><text x="100" y="145" font-size="58" fill="#10243A" font-weight="700">วันนี้ต้องได้ข้อสรุป 3 เรื่อง</text><text x="100" y="300" font-size="42" fill="#8A5A14" font-weight="700">01</text><text x="245" y="300" font-size="42" fill="#10243A" font-weight="700">กำหนดการ</text><text x="245" y="365" font-size="30" fill="#10243A" font-weight="400">ยืนยันลำดับกิจกรรมและเวลารวม</text><text x="100" y="465" font-size="42" fill="#8A5A14" font-weight="700">02</text><text x="245" y="465" font-size="42" fill="#10243A" font-weight="700">ผู้รับผิดชอบ</text><text x="245" y="530" font-size="30" fill="#10243A" font-weight="400">ระบุผู้ประสานงานแต่ละด้าน</text><text x="100" y="630" font-size="42" fill="#8A5A14" font-weight="700">03</text><text x="245" y="630" font-size="42" fill="#10243A" font-weight="700">ทรัพยากร</text><text x="245" y="695" font-size="30" fill="#10243A" font-weight="400">ตรวจห้อง อุปกรณ์ และข้อจำกัด</text><text x="100" y="825" font-size="25" fill="#526273" font-weight="400">สถานการณ์สมมติสำหรับฝึกออกแบบ</text></g></svg>