<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">บันทึกมติและงานถัดไป</title><desc id="desc">ตารางแม่แบบสำหรับเติมชื่อผู้รับผิดชอบและวันที่หลังประชุมจริง</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F8FAFC"/><text x="100" y="145" font-size="58" fill="#10243A" font-weight="700">บันทึกมติและงานถัดไป</text><text x="100" y="285" font-size="31" fill="#8A5A14" font-weight="700">รายการ</text><text x="740" y="285" font-size="31" fill="#8A5A14" font-weight="700">ผู้รับผิดชอบ</text><text x="1130" y="285" font-size="31" fill="#8A5A14" font-weight="700">กำหนดส่ง</text><rect x="100" y="430" width="1370" height="2" rx="0" fill="#CBD5E1"/><text x="100" y="390" font-size="32" fill="#10243A" font-weight="400">ยืนยันกำหนดการ</text><text x="740" y="390" font-size="32" fill="#10243A" font-weight="400">[ระบุชื่อ]</text><text x="1130" y="390" font-size="32" fill="#10243A" font-weight="400">[ระบุวันที่]</text><rect x="100" y="565" width="1370" height="2" rx="0" fill="#CBD5E1"/><text x="100" y="525" font-size="32" fill="#10243A" font-weight="400">ตรวจห้องและอุปกรณ์</text><text x="740" y="525" font-size="32" fill="#10243A" font-weight="400">[ระบุชื่อ]</text><text x="1130" y="525" font-size="32" fill="#10243A" font-weight="400">[ระบุวันที่]</text><rect x="100" y="700" width="1370" height="2" rx="0" fill="#CBD5E1"/><text x="100" y="660" font-size="32" fill="#10243A" font-weight="400">สรุปเอกสารหลังประชุม</text><text x="740" y="660" font-size="32" fill="#10243A" font-weight="400">[ระบุชื่อ]</text><text x="1130" y="660" font-size="32" fill="#10243A" font-weight="400">[ระบุวันที่]</text><text x="100" y="820" font-size="28" fill="#526273" font-weight="400">แม่แบบรอบันทึกผลจริง ไม่ใช่มติที่เกิดขึ้นแล้ว</text></g></svg>