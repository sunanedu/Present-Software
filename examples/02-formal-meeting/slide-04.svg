<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">เสนอจัดเวิร์กช็อปสองช่วง</title><desc id="desc">ข้อเสนอเพื่อพิจารณาสองช่วง และคำขอมติที่ยังไม่ได้รับการอนุมัติ</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F8FAFC"/><text x="100" y="145" font-size="56" fill="#10243A" font-weight="700">ข้อเสนอเพื่อพิจารณา</text><text x="100" y="235" font-size="56" fill="#10243A" font-weight="700">จัดเวิร์กช็อปเป็น 2 ช่วง</text><rect x="100" y="390" width="650" height="5" rx="0" fill="#8A5A14"/><text x="100" y="475" font-size="36" fill="#10243A" font-weight="700">ช่วงที่ 1: เรียนรู้พื้นฐาน</text><text x="100" y="565" font-size="32" fill="#10243A" font-weight="400">ฝึกวางสารและจัดหน้า</text><text x="100" y="635" font-size="32" fill="#10243A" font-weight="400">เตรียมโครงงาน 5 สไลด์</text><rect x="850" y="390" width="650" height="5" rx="0" fill="#8A5A14"/><text x="850" y="475" font-size="36" fill="#10243A" font-weight="700">ช่วงที่ 2: ลงมือและนำเสนอ</text><text x="850" y="565" font-size="32" fill="#10243A" font-weight="400">ทำงานเป็นคู่และวิจารณ์</text><text x="850" y="635" font-size="32" fill="#10243A" font-weight="400">ซ้อมพูดพร้อมรับข้อเสนอแนะ</text><text x="100" y="790" font-size="36" fill="#8A5A14" font-weight="700">ขอมติ: เห็นชอบรูปแบบหรือเสนอแก้ไข</text><text x="100" y="850" font-size="25" fill="#526273" font-weight="400">ข้อเสนอสมมติ ยังไม่ใช่มติที่ประชุม</text></g></svg>