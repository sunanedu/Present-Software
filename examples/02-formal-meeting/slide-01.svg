<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ประชุมเตรียมกิจกรรมทักษะดิจิทัล</title><desc id="desc">ปกประชุมอย่างเป็นทางการ ระบุวันที่ฉบับและสถานการณ์สมมติ ไม่มีตราหน่วยงานจริง</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F8FAFC"/><rect x="0" y="0" width="48" height="900" rx="0" fill="#10243A"/><rect x="110" y="170" width="110" height="7" rx="0" fill="#8A5A14"/><text x="110" y="290" font-size="62" fill="#10243A" font-weight="700">การประชุมเตรียมความพร้อม</text><text x="110" y="390" font-size="62" fill="#10243A" font-weight="700">กิจกรรมทักษะดิจิทัล</text><text x="110" y="560" font-size="31" fill="#10243A" font-weight="400">21 พฤศจิกายน 2569</text><text x="110" y="625" font-size="31" fill="#10243A" font-weight="400">ห้องประชุมตัวอย่าง · ผู้ประสานงานกิจกรรม</text><text x="110" y="815" font-size="26" fill="#526273" font-weight="400">สถานการณ์สมมติสำหรับฝึกออกแบบ</text><rect x="1350" y="110" width="140" height="680" rx="0" fill="#10243A"/><rect x="1310" y="155" width="35" height="110" rx="0" fill="#8A5A14"/></g></svg>