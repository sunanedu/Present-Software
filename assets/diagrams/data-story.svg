<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">กราฟจำนวนแก้วสมมติ 500 และ 400 ใบ</title><desc id="desc">กราฟแท่งแนวนอนแกนศูนย์ถึงหกร้อย เปรียบเทียบห้าร้อยกับสี่ร้อยใบ ลดลงหนึ่งร้อยใบหรือยี่สิบเปอร์เซ็นต์จากฐานห้าร้อย</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF"/><text x="100" y="130" font-size="52" fill="#183153" font-weight="700">จำนวนแก้วลดลง 100 ใบในชุดข้อมูลสมมติ</text><text x="100" y="210" font-size="28" fill="#006D77" font-weight="400">นับรวมวันจันทร์–ศุกร์ · เปรียบเทียบสองสัปดาห์ · ไม่ใช่ผลกิจกรรมจริง</text><rect x="400.0" y="280" width="1" height="360" rx="0" fill="#CBD5E1"/><text x="390.0" y="690" font-size="25" fill="#183153" font-weight="400">0</text><rect x="550.0" y="280" width="1" height="360" rx="0" fill="#CBD5E1"/><text x="540.0" y="690" font-size="25" fill="#183153" font-weight="400">100</text><rect x="700.0" y="280" width="1" height="360" rx="0" fill="#CBD5E1"/><text x="690.0" y="690" font-size="25" fill="#183153" font-weight="400">200</text><rect x="850.0" y="280" width="1" height="360" rx="0" fill="#CBD5E1"/><text x="840.0" y="690" font-size="25" fill="#183153" font-weight="400">300</text><rect x="1000.0" y="280" width="1" height="360" rx="0" fill="#CBD5E1"/><text x="990.0" y="690" font-size="25" fill="#183153" font-weight="400">400</text><rect x="1150.0" y="280" width="1" height="360" rx="0" fill="#CBD5E1"/><text x="1140.0" y="690" font-size="25" fill="#183153" font-weight="400">500</text><rect x="1300.0" y="280" width="1" height="360" rx="0" fill="#CBD5E1"/><text x="1290.0" y="690" font-size="25" fill="#183153" font-weight="400">600</text><text x="100" y="380" font-size="32" fill="#183153" font-weight="400">สัปดาห์ก่อน</text><rect x="400" y="330" width="750.0" height="80" rx="4" fill="#526273"/><text x="1180.0" y="380" font-size="35" fill="#526273" font-weight="700">500</text><text x="100" y="550" font-size="32" fill="#183153" font-weight="400">สัปดาห์ทดลอง</text><rect x="400" y="500" width="600.0" height="80" rx="4" fill="#006D77"/><text x="1030.0" y="550" font-size="35" fill="#006D77" font-weight="700">400</text><text x="1250" y="750" font-size="28" fill="#183153" font-weight="400">จำนวน (ใบ)</text><text x="100" y="815" font-size="25" fill="#006D77" font-weight="400">500 เป็น 400 ใบ ลดลง 20% จากฐาน 500 ใบ</text><text x="100" y="860" font-size="25" fill="#006D77" font-weight="400">ที่มา: ตารางสมมติในหน่วย 4 ยังสรุปไม่ได้ว่ากิจกรรมเป็นสาเหตุ</text></g></svg>