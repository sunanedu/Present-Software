<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ขั้นตอนเรียนรู้การสร้างสไลด์ด้วย Gamma</title><desc id="desc">ภาพประกอบต้นฉบับสำหรับหลักสูตร AI Presentation Studio</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F8FAFC"/><text x="80" y="105" font-size="48" fill="#183153" font-weight="700">จากโจทย์ สู่สไลด์ที่ตรวจแล้ว</text><rect x="80" y="240" width="340" height="390" rx="18" fill="#FFFFFF"/><text x="110" y="330" font-size="64" fill="#7561B5" font-weight="700">01</text><text x="110" y="430" font-size="36" fill="#183153" font-weight="700">เตรียมโจทย์</text><text x="110" y="505" font-size="23" fill="#183153" font-weight="400">ผู้ฟัง / สาร / หลักฐาน</text><path d="M 425 425 h 28 m -8 -8 l 8 8 -8 8" stroke="#356859" stroke-width="4" fill="none"/><rect x="465" y="240" width="340" height="390" rx="18" fill="#FFFFFF"/><text x="495" y="330" font-size="64" fill="#7561B5" font-weight="700">02</text><text x="495" y="430" font-size="36" fill="#183153" font-weight="700">สั่ง AI</text><text x="495" y="505" font-size="23" fill="#183153" font-weight="400">ภาษาไทย / 5 หน้า</text><path d="M 810 425 h 28 m -8 -8 l 8 8 -8 8" stroke="#356859" stroke-width="4" fill="none"/><rect x="850" y="240" width="340" height="390" rx="18" fill="#FFFFFF"/><text x="880" y="330" font-size="64" fill="#7561B5" font-weight="700">03</text><text x="880" y="430" font-size="36" fill="#183153" font-weight="700">ตรวจแก้</text><text x="880" y="505" font-size="23" fill="#183153" font-weight="400">ข้อมูล / ภาพ / ภาษา</text><path d="M 1195 425 h 28 m -8 -8 l 8 8 -8 8" stroke="#356859" stroke-width="4" fill="none"/><rect x="1235" y="240" width="340" height="390" rx="18" fill="#FFFFFF"/><text x="1265" y="330" font-size="64" fill="#7561B5" font-weight="700">04</text><text x="1265" y="430" font-size="36" fill="#183153" font-weight="700">ทดลองใช้</text><text x="1265" y="505" font-size="23" fill="#183153" font-weight="400">ฉายจริง / ซ้อมพูด</text><text x="80" y="760" font-size="29" fill="#526273" font-weight="400">ภาพสรุปกระบวนการ ไม่ใช่ภาพหน้าจอโปรแกรม Gamma</text></g></svg>