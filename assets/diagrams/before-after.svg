<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ก่อนและหลังปรับองค์ประกอบสไลด์</title><desc id="desc">ภาพประกอบต้นฉบับสำหรับหลักสูตร AI Presentation Studio</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F8FAFC"/><text x="80" y="105" font-size="48" fill="#183153" font-weight="700">จัดหน้าใหม่ ให้เห็นสารหลักใน 5 วินาที</text><rect x="80" y="175" width="680" height="550" rx="20" fill="#E8EDF3"/><rect x="840" y="175" width="680" height="550" rx="20" fill="#FFFFFF"/><text x="115" y="235" font-size="30" fill="#526273" font-weight="400">ก่อนปรับ</text><text x="875" y="235" font-size="30" fill="#356859" font-weight="400">หลังปรับ</text><text x="130" y="320" font-size="38" fill="#7B3E90" font-weight="700">ข้อมูลประกอบ</text><text x="130" y="390" font-size="27" fill="#596B7D" font-weight="400">เรื่องที่หนึ่ง เรื่องที่สอง เรื่องที่สาม</text><text x="130" y="450" font-size="27" fill="#596B7D" font-weight="400">รายละเอียดที่ผู้ฟังต้องอ่านทั้งหมด</text><text x="130" y="510" font-size="27" fill="#596B7D" font-weight="400">ข้อความสำคัญซ่อนอยู่ในย่อหน้า</text><text x="130" y="570" font-size="27" fill="#596B7D" font-weight="400">ภาพตกแต่งหลายภาพแย่งความสนใจ</text><rect x="160" y="620" width="170" height="50" rx="0" fill="#A7B4C3"/><rect x="410" y="620" width="220" height="50" rx="0" fill="#B6A4C5"/><text x="890" y="335" font-size="49" fill="#10243A" font-weight="700">พกแก้วส่วนตัว</text><text x="890" y="410" font-size="49" fill="#10243A" font-weight="700">เริ่มวันจันทร์นี้</text><rect x="890" y="510" width="520" height="6" rx="0" fill="#356859"/><text x="890" y="580" font-size="30" fill="#356859" font-weight="400">เลือกแก้วที่พกสะดวก</text><text x="890" y="640" font-size="30" fill="#356859" font-weight="400">ตั้งเตือนก่อนออกจากบ้าน</text><text x="80" y="820" font-size="32" fill="#183153" font-weight="400">ตัดส่วนเกิน · จัดแนว · เน้นประเด็นเดียว · เว้นพื้นที่</text></g></svg>