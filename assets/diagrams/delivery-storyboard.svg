<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">สตอรีบอร์ดสำหรับซ้อมพูดสามนาที</title><desc id="desc">ภาพประกอบต้นฉบับสำหรับหลักสูตร AI Presentation Studio</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF"/><text x="80" y="110" font-size="49" fill="#183153" font-weight="700">สไลด์เล่าเรื่อง ผู้พูดเชื่อมความหมาย</text><rect x="80" y="260" width="340" height="330" rx="15" fill="#F0F5F7"/><text x="110" y="345" font-size="44" fill="#006D77" font-weight="700">เปิด</text><text x="110" y="425" font-size="25" fill="#183153" font-weight="400">ชวนสนใจด้วยโจทย์</text><text x="110" y="530" font-size="32" fill="#183153" font-weight="700">20 วินาที</text><rect x="465" y="260" width="340" height="330" rx="15" fill="#F0F5F7"/><text x="495" y="345" font-size="44" fill="#006D77" font-weight="700">อธิบาย</text><text x="495" y="425" font-size="25" fill="#183153" font-weight="400">ให้เห็นประเด็นสำคัญ</text><text x="495" y="530" font-size="32" fill="#183153" font-weight="700">60 วินาที</text><rect x="850" y="260" width="340" height="330" rx="15" fill="#F0F5F7"/><text x="880" y="345" font-size="44" fill="#006D77" font-weight="700">หลักฐาน</text><text x="880" y="425" font-size="25" fill="#183153" font-weight="400">อ่านค่าพร้อมข้อจำกัด</text><text x="880" y="530" font-size="32" fill="#183153" font-weight="700">70 วินาที</text><rect x="1235" y="260" width="340" height="330" rx="15" fill="#F0F5F7"/><text x="1265" y="345" font-size="44" fill="#006D77" font-weight="700">จบ</text><text x="1265" y="425" font-size="25" fill="#183153" font-weight="400">บอกสิ่งที่จะทำต่อ</text><text x="1265" y="530" font-size="32" fill="#183153" font-weight="700">30 วินาที</text><text x="80" y="735" font-size="31" fill="#183153" font-weight="400">ตัวอย่างเวลารวม 3 นาที: ปรับตามเรื่องและผู้ฟังจริง</text><text x="80" y="800" font-size="31" fill="#183153" font-weight="400">เตรียมคำอธิบายภาพ คำบรรยายสื่อ และ PDF สำรอง</text></g></svg>