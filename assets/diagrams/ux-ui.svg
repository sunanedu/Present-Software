<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">UX และ UI สำหรับงานนำเสนอ</title><desc id="desc">ภาพประกอบต้นฉบับสำหรับหลักสูตร AI Presentation Studio</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F8FAFC"/><text x="80" y="105" font-size="48" fill="#183153" font-weight="700">ประสบการณ์ที่ดี เริ่มจากผู้ฟัง</text><rect x="80" y="180" width="680" height="540" rx="20" fill="#E4F1EE"/><rect x="840" y="180" width="680" height="540" rx="20" fill="#EBE8FA"/><text x="125" y="270" font-size="70" fill="#356859" font-weight="700">UX</text><text x="885" y="270" font-size="70" fill="#51418D" font-weight="700">UI</text><text x="125" y="370" font-size="37" fill="#183153" font-weight="400">ผู้ฟังคือใคร</text><text x="125" y="465" font-size="37" fill="#183153" font-weight="400">เรื่องเรียงอย่างไร</text><text x="125" y="560" font-size="37" fill="#183153" font-weight="400">เข้าใจและทำอะไรต่อ</text><text x="885" y="370" font-size="37" fill="#183153" font-weight="400">หัวข้ออ่านชัด</text><text x="885" y="465" font-size="37" fill="#183153" font-weight="400">สีและเลย์เอาต์สม่ำเสมอ</text><text x="885" y="560" font-size="37" fill="#183153" font-weight="400">ลิงก์และปุ่มเข้าใจง่าย</text><text x="80" y="820" font-size="32" fill="#183153" font-weight="400">ทดสอบกับคนจริง แล้วแก้จุดที่อ่านหรือเข้าใจติดขัด</text></g></svg>