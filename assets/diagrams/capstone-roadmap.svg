<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ห้าขั้นตอนโครงงานนำเสนอด้วย AI</title><desc id="desc">ภาพประกอบต้นฉบับสำหรับหลักสูตร AI Presentation Studio</desc><g font-family="Tahoma, Leelawadee UI, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF"/><text x="80" y="110" font-size="48" fill="#183153" font-weight="700">โครงงานจบที่งานที่ผู้ฟังใช้งานได้</text><rect x="80" y="270" width="260" height="355" rx="14" fill="#F0F5F7"/><text x="105" y="350" font-size="56" fill="#006D77" font-weight="700">1</text><text x="105" y="445" font-size="36" fill="#183153" font-weight="700">ตั้งโจทย์</text><text x="105" y="535" font-size="24" fill="#183153" font-weight="400">ผู้ฟังและผลลัพธ์</text><rect x="385" y="270" width="260" height="355" rx="14" fill="#F0F5F7"/><text x="410" y="350" font-size="56" fill="#006D77" font-weight="700">2</text><text x="410" y="445" font-size="36" fill="#183153" font-weight="700">ตรวจข้อมูล</text><text x="410" y="535" font-size="24" fill="#183153" font-weight="400">หลักฐานและสิทธิ์</text><rect x="690" y="270" width="260" height="355" rx="14" fill="#F0F5F7"/><text x="715" y="350" font-size="56" fill="#006D77" font-weight="700">3</text><text x="715" y="445" font-size="36" fill="#183153" font-weight="700">สร้างร่าง</text><text x="715" y="535" font-size="24" fill="#183153" font-weight="400">AI และการแก้เอง</text><rect x="995" y="270" width="260" height="355" rx="14" fill="#F0F5F7"/><text x="1020" y="350" font-size="56" fill="#006D77" font-weight="700">4</text><text x="1020" y="445" font-size="36" fill="#183153" font-weight="700">ทดสอบ</text><text x="1020" y="535" font-size="24" fill="#183153" font-weight="400">วิจารณ์และซ้อม</text><rect x="1300" y="270" width="260" height="355" rx="14" fill="#F0F5F7"/><text x="1325" y="350" font-size="56" fill="#006D77" font-weight="700">5</text><text x="1325" y="445" font-size="36" fill="#183153" font-weight="700">ส่งมอบ</text><text x="1325" y="535" font-size="24" fill="#183153" font-weight="400">ไฟล์และแฟ้มงาน</text><text x="80" y="770" font-size="33" fill="#183153" font-weight="400">ผ่านแต่ละจุดตรวจ แล้วเก็บหลักฐานว่าปรับงานเพราะอะไร</text></g></svg>